<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">Current stack</title>
  <desc id="d">Languages and runtime: Python, Go, JavaScript, TypeScript, Node.js, Docker, PostgreSQL, Redis, Linux. Tooling and infrastructure: Burp Suite, ProjectDiscovery, Playwright, WSL2, Cloudflare, DigitalOcean, Git, GitHub Actions.</desc>
  <defs>
    <style>
      svg{
        --bg-a:#f7fafd; --bg-b:#eef4fa;
        --chip:#ffffff; --border:#c6d5e2; --border-2:#d9e4ee;
        --a1:#0e7490; --a2:#0f766e; --fg-2:#334155; --muted:#55657a;
      }
      @media (prefers-color-scheme: dark){
        svg{
          --bg-a:#060b13; --bg-b:#0b1624;
          --chip:#081522; --border:#1d3b52; --border-2:#17384d;
          --a1:#22d3ee; --a2:#2dd4bf; --fg-2:#cbd5e1; --muted:#94a3b8;
        }
      }
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .c{fill:var(--chip);stroke:var(--border-2)}
      .l{fill:var(--fg-2);font-size:15px}
      .h{fill:var(--muted);font-size:12px;letter-spacing:2.5px;text-anchor:middle}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="var(--bg-a)"/><stop offset="1" stop-color="var(--bg-b)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" rx="16" fill="url(#bg)" stroke="var(--border)"/>

  <text x="600" y="40" class="m h">LANGUAGES · RUNTIME</text>
  <g>
    <rect class="c" x="97"  y="54" width="94"  height="34" rx="9"/><circle cx="110"  cy="71" r="3.5" fill="var(--a1)"/><text x="121"  y="76" class="m l" textLength="54">Python</text>
    <rect class="c" x="203" y="54" width="58"  height="34" rx="9"/><circle cx="216" cy="71" r="3.5" fill="var(--a2)"/><text x="227" y="76" class="m l" textLength="18">Go</text>
    <rect class="c" x="273" y="54" width="130" height="34" rx="9"/><circle cx="286" cy="71" r="3.5" fill="var(--a1)"/><text x="297" y="76" class="m l" textLength="90">JavaScript</text>
    <rect class="c" x="415" y="54" width="130" height="34" rx="9"/><circle cx="428" cy="71" r="3.5" fill="var(--a2)"/><text x="439" y="76" class="m l" textLength="90">TypeScript</text>
    <rect class="c" x="557" y="54" width="103" height="34" rx="9"/><circle cx="570" cy="71" r="3.5" fill="var(--a1)"/><text x="581" y="76" class="m l" textLength="63">Node.js</text>
    <rect class="c" x="672" y="54" width="94"  height="34" rx="9"/><circle cx="685" cy="71" r="3.5" fill="var(--a2)"/><text x="696" y="76" class="m l" textLength="54">Docker</text>
    <rect class="c" x="778" y="54" width="130" height="34" rx="9"/><circle cx="791" cy="71" r="3.5" fill="var(--a1)"/><text x="802" y="76" class="m l" textLength="90">PostgreSQL</text>
    <rect class="c" x="920" y="54" width="85"  height="34" rx="9"/><circle cx="933" cy="71" r="3.5" fill="var(--a2)"/><text x="944" y="76" class="m l" textLength="45">Redis</text>
    <rect class="c" x="1017" y="54" width="85" height="34" rx="9"/><circle cx="1030" cy="71" r="3.5" fill="var(--a1)"/><text x="1041" y="76" class="m l" textLength="45">Linux</text>
  </g>

  <text x="600" y="124" class="m h">TOOLING · INFRASTRUCTURE</text>
  <g>
    <rect class="c" x="42"  y="138" width="130" height="34" rx="9"/><circle cx="55"  cy="155" r="3.5" fill="var(--a2)"/><text x="66"  y="160" class="m l" textLength="90">Burp Suite</text>
    <rect class="c" x="184" y="138" width="184" height="34" rx="9"/><circle cx="197" cy="155" r="3.5" fill="var(--a1)"/><text x="208" y="160" class="m l" textLength="144">ProjectDiscovery</text>
    <rect class="c" x="380" y="138" width="130" height="34" rx="9"/><circle cx="393" cy="155" r="3.5" fill="var(--a2)"/><text x="404" y="160" class="m l" textLength="90">Playwright</text>
    <rect class="c" x="522" y="138" width="76"  height="34" rx="9"/><circle cx="535" cy="155" r="3.5" fill="var(--a1)"/><text x="546" y="160" class="m l" textLength="36">WSL2</text>
    <rect class="c" x="610" y="138" width="130" height="34" rx="9"/><circle cx="623" cy="155" r="3.5" fill="var(--a2)"/><text x="634" y="160" class="m l" textLength="90">Cloudflare</text>
    <rect class="c" x="752" y="138" width="148" height="34" rx="9"/><circle cx="765" cy="155" r="3.5" fill="var(--a1)"/><text x="776" y="160" class="m l" textLength="108">DigitalOcean</text>
    <rect class="c" x="912" y="138" width="67"  height="34" rx="9"/><circle cx="925" cy="155" r="3.5" fill="var(--a2)"/><text x="936" y="160" class="m l" textLength="27">Git</text>
    <rect class="c" x="991" y="138" width="166" height="34" rx="9"/><circle cx="1004" cy="155" r="3.5" fill="var(--a1)"/><text x="1015" y="160" class="m l" textLength="126">GitHub Actions</text>
  </g>
</svg>
